name: loweve

services:
  loweve:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: loweve:latest
    container_name: loweve
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内固定写挂载卷 /data（覆盖 .env 里 LOWEVE_DATA_DIR 的宿主路径值，
      # 否则容器内 ./data 会落到 /app/server/data，重建即丢库）
      - LOWEVE_DATA_DIR=/data
      - TZ=Asia/Shanghai
      # 墙内访问 TMDB 需要代理时，设置标准代理变量即可（留空则全程直连，海外/CI 无需配置）。
      # 后端会读 HTTPS_PROXY 给外网 fetch 挂代理；NO_PROXY 内务必排除内网 LLM 端点。
      # - HTTPS_PROXY=http://你的代理地址:端口
      # - NO_PROXY=cli-proxy-api,localhost,127.0.0.1
    ports:
      - "18083:18083"          # 浏览器访问 http://localhost:18083
    volumes:
      - ${LOWEVE_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18083/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
